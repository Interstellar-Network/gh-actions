name: "cmake-build-and-test"
description: "Run CMake with CMakePreset.json to configure, build and test C/C++ source code."

inputs:
  working-directory:
    description: "working-directory is only supported for 'run' action NOT 'uses' so we need to DIY"
    required: false
    default: "${{ github.workspace }}"
  # same issue with 'github' context:
  # "Unrecognized named-value: 'github'"
  cmake_lists_txt_path_input:
    description: "SSH key of a MACHINE USER with access to all the org's repos"
    required: true
    default: "${{ github.workspace }}/CMakeLists.txt"
  cmake_args:
    description: "additional args passed to cmake"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    ############################################################################
    # Ccache restore: dual-provider — uses env.CACHE_BACKEND (exported by
    # prepare/action.yml) to select between GitHub or WarpBuilds backends.
    # Per https://www.warpbuild.com/docs/ci/features/caching#%EF%B8%8F-read-first,
    # standard actions/cache is recommended for most users; the default is 'github'.
    # WarpBuilds cache is only needed for BYOC or advanced use cases.
    # If CACHE_BACKEND is not set (standalone use), falls back to 'github'.

    - name: Resolve cache provider
      id: resolve-provider
      run: |
        PROVIDER="${CACHE_BACKEND:-github}"
        echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Set ccache cache config
      id: ccache-config
      run: |
        echo "path=~/.cache/ccache" >> "$GITHUB_OUTPUT"
        echo "key=cache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
        echo "restore-keys<<EOF" >> "$GITHUB_OUTPUT"
        echo "cache-${{ runner.os }}-${{ runner.arch }}-" >> "$GITHUB_OUTPUT"
        echo "cache-${{ runner.os }}-" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: ccache restore (GitHub)
      id: restore-github
      if: steps.resolve-provider.outputs.provider != 'warp'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.ccache-config.outputs.path }}
        key: ${{ steps.ccache-config.outputs.key }}
        restore-keys: ${{ steps.ccache-config.outputs.restore-keys }}

    # WarpBuilds ccache restore — only active when provider is 'warp'.
    - name: ccache restore (WarpBuilds)
      id: restore-warp
      if: steps.resolve-provider.outputs.provider == 'warp'
      uses: WarpBuilds/cache/restore@v1
      with:
        path: ${{ steps.ccache-config.outputs.path }}
        key: ${{ steps.ccache-config.outputs.key }}
        restore-keys: ${{ steps.ccache-config.outputs.restore-keys }}

    # Export the cache key (from whichever provider ran) so save steps below
    # can reference it without duplicating the config logic.
    # Since the primary key is SHA-based (unique per commit), the restore
    # will always use restore-keys. We save under the primary key so future
    # runs find this cache via restore-keys.
    - name: Export ccache key for save
      id: export-key
      run: |
        echo "CCHACHE_KEY=${{ steps.ccache-config.outputs.key }}" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    ###################################
    - name: clang-format
      run: fd --type f --extension cpp --extension h --extension hpp --extension cc --extension cxx --extension hh --extension hxx | xargs clang-format --dry-run -Werror
      shell: bash

    # cf https://github.com/marketplace/actions/run-cmake
    # and https://github.com/lukka/CppCMakeVcpkgTemplate/blob/main/.github/workflows/hosted-ninja-vcpkg_submod.yml
    # TODO use Ninja Multi Config(and same when dev locally)
    # - uses: lukka/run-cmake@v10
    #   # valid inputs are ['cmakeListsTxtPath', 'configurePreset',
    #   # 'buildPreset', 'testPreset', 'useShell', 'logCollectionRegExps',
    #   # 'configurePresetCmdString', 'buildPresetCmdString',
    #   # 'testPresetCmdString', 'runVcpkgEnvFormatString']
    #   # why is this not done automatically??
    #   # also for some reason we need to copy to another env var; INPUT_SSH_KEY_INPUT DOES NOT work
    #   env:
    #     ENV_CMAKE_LISTS_TXT_PATH: ${{ inputs.cmake_lists_txt_path_input }}
    #   with:
    #     cmakeListsTxtPath: "${{ env.ENV_CMAKE_LISTS_TXT_PATH }}"
    #     configurePreset: "config-testing"
    #     buildPreset: "build-debug"
    #     testPreset: "test-debug"
    #
    - name: CMake configure
      run: |
        cmake -S . -GNinja --preset=config-testing ${{ inputs.cmake_args }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: CMake build
      # NOTE: "binaryDir" is in CMakePresets.json so you pass either "--build some-dir" or "--build --preset=some-preset"
      run: |
        cmake --build --preset=build-debug
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: CTest
      # TODO remove --verbose
      run: |
        ctest --preset=test-debug --verbose
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    # ── Cache save (always, even on failure) ──
    # Uses the key from restore (or a fallback computed key) since the build
    # may have added new ccache objects. If the key already exists (exact hit
    # from restore), the save simply confirms the existing entry is valid.
    # Provider resolved from env.CACHE_BACKEND (exported by prepare) or 'github'.

    - uses: actions/cache/save@v5
      if: always() && steps.resolve-provider.outputs.provider != 'warp'
      with:
        key: ${{ steps.export-key.outputs.CCHACHE_KEY }}
        path: ~/.cache/ccache

    - uses: WarpBuilds/cache/save@v1
      if: always() && steps.resolve-provider.outputs.provider == 'warp'
      with:
        key: ${{ steps.export-key.outputs.CCHACHE_KEY }}
        path: ~/.cache/ccache

    - name: Print cache stats
      if: always()
      run: |
        ccache --show-stats 2>/dev/null || echo "ccache not found!"
        sccache --show-stats 2>/dev/null || echo "sccache not found!"
      shell: bash
      working-directory: ${{ inputs.working-directory }}


    ############################################################################
    - name: Check if conan installed
      id: check-conan-exists
      run: |
        echo "conan-exists=$(command -v conan &> /dev/null && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    # [CONAN CACHE CLEANUP]
    # cf https://github.com/conan-io/conan/issues/308
    - name: CONAN CACHE CLEANUP
      if: fromJSON(steps.check-conan-exists.outputs.conan-exists)
      run: |
        conan remove --build --src --force "*"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
