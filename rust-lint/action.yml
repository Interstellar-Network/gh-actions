name: "rust-lint"
description: "Run CMake with CMakePreset.json to configure, build and test C/C++ source code."

inputs:
  working-directory:
    description: "working-directory is only supported for 'run' action NOT 'uses' so we need to DIY"
    required: false
    default: "${{ github.workspace }}"
  fmt_args:
    description: "args passed to cargo fmt"
    required: false
    default: "-- --check"
  clippy_args:
    description: "args passed to cargo fmt"
    required: false
    default: "-- -D warnings"

runs:
  using: "composite"
  steps:
    - name: Run cargo fmt
      run: cargo fmt ${{ inputs.fmt_args }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    # NOTE: cargo check: clippy internally runs "cargo check" so no point in doing it manually
    - name: Run cargo clippy
      run: cargo clippy ${{ inputs.clippy_args }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    # ── Cache save (always, even on failure) ──
    # Provider resolved from env.CACHE_BACKEND (exported by prepare) or 'github'.
    # See https://www.warpbuild.com/docs/ci/features/caching#%EF%B8%8F-read-first
    # for WarpBuilds caching docs.  Their docs recommend standard actions/cache
    # for most users — the default provider is 'github' for this reason.
    - name: Resolve cache provider for save
      id: save-resolve-provider
      run: |
        PROVIDER="${CACHE_BACKEND:-github}"
        echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Compute variant-specific cache key
      id: variant-key
      if: always()
      run: |
        # Hash inputs that differ between matrix variants so each variant
        # gets a unique save key — no race when parallel jobs share the same
        # Cargo.lock but use different clippy/fmt args.
        # Non-matrix callers keep defaults → no suffix → exact key match.
        SUFFIX=""
        if [ -n "${{ inputs.fmt_args }}" ] || [ -n "${{ inputs.clippy_args }}" ]; then
          SUFFIX="-$(echo "${{ inputs.fmt_args }}${{ inputs.clippy_args }}" | sha256sum | cut -c1-16)"
        fi
        # Derive effective keys from env vars (set by prepare_rust)
        if [ -n "${SCCACHE_KEY}" ]; then
          echo "sccache-key=${SCCACHE_KEY}${SUFFIX}" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "${CARGO_CACHE_KEY}" ]; then
          echo "cargo-key=${CARGO_CACHE_KEY}${SUFFIX}" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - uses: actions/cache/save@v5
      if: always() && steps.variant-key.outputs.sccache-key != '' && steps.save-resolve-provider.outputs.provider != 'warp'
      with:
        key: ${{ steps.variant-key.outputs.sccache-key }}
        path: ~/.cache/sccache

    # WarpBuilds cache save — only active when provider is 'warp'.
    # See https://www.warpbuild.com/docs/ci/features/caching#%EF%B8%8F-read-first
    # — standard actions/cache is the recommended default.
    - uses: WarpBuilds/cache/save@v1
      if: always() && steps.variant-key.outputs.sccache-key != '' && steps.save-resolve-provider.outputs.provider == 'warp'
      with:
        key: ${{ steps.variant-key.outputs.sccache-key }}
        path: ~/.cache/sccache

    - uses: actions/cache/save@v5
      if: always() && steps.variant-key.outputs.cargo-key != '' && steps.save-resolve-provider.outputs.provider != 'warp'
      with:
        key: ${{ steps.variant-key.outputs.cargo-key }}
        path: |
          ~/.cargo/registry/
          ~/.cargo/git/db/
          ${{ inputs.working-directory }}/target/

    - uses: WarpBuilds/cache/save@v1
      if: always() && steps.variant-key.outputs.cargo-key != '' && steps.save-resolve-provider.outputs.provider == 'warp'
      with:
        key: ${{ steps.variant-key.outputs.cargo-key }}
        path: |
          ~/.cargo/registry/
          ~/.cargo/git/db/
          ${{ inputs.working-directory }}/target/

    - name: Print cache stats
      if: always()
      run: |
        ccache --show-stats 2>/dev/null || echo "ccache not found!"
        sccache --show-stats 2>/dev/null || echo "sccache not found!"
      shell: bash


    # TODO cargo install
    # do we call "cargo build --profile={{ matrix.build }}" manually or not needed?
