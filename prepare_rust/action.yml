name: "prepare-rust"
description: "Additional preparations for Rust"

inputs:
  working-directory:
    description: "working-directory is only supported for 'run' action NOT 'uses' so we need to DIY"
    required: false
    default: "${{ github.workspace }}"
  use_toolchain_toml:
    description: "Ignore toolchain_* inputs and parse rust-toolchain.toml instead"
    required: false
    default: "false"
  # Typically rust-toolchain.toml is used from our SGX projects, and those are
  # usually in enclave/ directory, or some other subdir.
  toolchain_toml_path:
    description: "PATH to rust-toolchain.toml; only applicable when 'use_toolchain_toml'"
    required: false
    default: "rust-toolchain.toml"
  toolchain_channel:
    description: "rust toolchain channel"
    required: false
    default: "stable"
  # https://github.com/dtolnay/rust-toolchain ONLY install "minimal"
  # But most of our workflows require fmt+clippy
  # DO NOT set a "default" here b/c we MSUT NOT install components on "nightly"
  # and for some reason GH actions CAN NOT override using an empty string("")
  # https://github.com/actions/runner/issues/924
  # eg: if the caller sets: 'toolchain_components: ""' -> here we have toolchain_components == default == eg "fmt,clippy"
  toolchain_components:
    description: "rust toolchain components"
    required: true
  install_sccache:
    description: "Install sccache"
    required: false
    default: "true"
  cache-provider:
    description: "Cache provider: 'github' (default, uses actions/cache) or 'warp' (uses WarpBuilds/cache). The switch is handled internally; callers only need to set this. At runtime, env.CACHE_PROVIDER takes precedence over this input."
    required: false
    default: "github"

outputs:
  cache-sccache-key:
    description: "The primary cache key used for sccache restore (empty if install_sccache is false)"
    value: "${{ steps.restore-sccache-github.outputs.cache-primary-key || steps.restore-sccache-warp.outputs.cache-primary-key }}"
  cache-sccache-hit:
    description: "Whether sccache was restored with an exact key match ('true' or 'false', empty if install_sccache is false)"
    value: "${{ steps.restore-sccache-github.outputs.cache-hit || steps.restore-sccache-warp.outputs.cache-hit }}"
  cache-cargo-key:
    description: "The primary cache key used for cargo+target restore (empty if install_sccache is false — since sccache must trigger first)"
    value: "${{ steps.restore-cargo-github.outputs.cache-primary-key || steps.restore-cargo-warp.outputs.cache-primary-key }}"
  cache-cargo-hit:
    description: "Whether cargo+target cache was restored with an exact key match ('true' or 'false', empty if install_sccache is false)"
    value: "${{ steps.restore-cargo-github.outputs.cache-hit || steps.restore-cargo-warp.outputs.cache-hit }}"

runs:
  using: "composite"
  steps:
    ############################################################################
    # NOTE:
    # - actions-rs/toolchain is not maintained anymore
    # - we COULD use https://github.com/dtolnay/rust-toolchain but:
    #   - it DOES NOT(and WILL NOT) support rust-toolchain.toml
    #   - it is installing(if needed) "rustup" but that is already installed on Github Runners
    # --> we use a manually modified version of its action.yml copy-pasted next to this file
    #

    # Parse rust-toolchain.toml if inputs.use_toolchain_toml OR use inputs.toolchain_channel directly
    #
    # https://github.com/dtolnay/rust-toolchain/issues/12
    # https://github.com/dtolnay/rust-toolchain/issues/29
    # https://github.com/ralexstokes/ethereum-consensus/blob/main/.github/workflows/ci.yml#L16-L26
    # NOTE: we CAN
    - name: "Rust channel: read rust-toolchain.toml"
      id: rust-toolchain
      run: |
        if [[ "${use_toolchain_toml}" == "true" ]]; then RUST_TOOLCHAIN=$(grep 'channel' ${{ inputs.toolchain_toml_path }} | awk '{split($0,a," = "); print a[2]}' | tr -d '"'); else RUST_TOOLCHAIN=${{ inputs.toolchain_channel }}; fi
        echo "RUST_TOOLCHAIN=$RUST_TOOLCHAIN" >> $GITHUB_OUTPUT
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        use_toolchain_toml: ${{ fromJSON(inputs.use_toolchain_toml) }}

    # cf https://github.com/dtolnay/rust-toolchain/blob/master/action.yml for what inputs are possible
    #
    # Swatinem/rust-cache: "selecting a toolchain either by action or manual `rustup` calls should happen
    # before the plugin, as it uses the current rustc version as its cache key"
    - name: Install toolchain
      uses: dtolnay/rust-toolchain@master
      id: dtolnay-rust-toolchain
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.RUST_TOOLCHAIN }}
        components: ${{ inputs.toolchain_components }}

    # https://github.com/actions-rs/toolchain#outputs
    # Technically we could just use outputs.rustc b/c guaranteed to change for every new compiler/build
    # but it is better to have human readable cache key to diagnose if something goes wrong
    # So just strip whitespaces from "outputs.rustc" instead(which contains the hash)
    - name: Set Rust compilerid
      id: set-rust-compilerid
      run: |
        echo "rust-compilerid=${{ steps.dtolnay-rust-toolchain.outputs.cachekey }}" >> $GITHUB_OUTPUT
      shell: bash
      working-directory: ${{ inputs.working-directory }}

      # NOTE We use a bunch of PRIVATE GitHub repositories so we MUST make sure we can authenticate; this is the easiest way: just use SSH
    - name: Cargo net.git-fetch-with-cli
      run: |
        echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $GITHUB_ENV
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    ############################################################################
    # cf prepare/action.yml for why not use hendrikmuhs/ccache-action
    # cf prepare/action.yml for why not use hendrikmuhs/ccache-action
    # MUST check if sscache already exists b/c prepare_rust CAN be called multiple time on the same host
    # error: "mkdir: cannot create directory '/tmp/sscache': File exists"
    #
    # NOTE: about sccache caching: we use explicit actions/cache/restore + actions/cache/save
    # (or WarpBuilds variants) instead of the old pat-s/always-upload-cache or Swatinem/rust-cache
    # cache-directories, so that we control the save timing and provider selection.

    - name: Check if sccache already in PATH
      if: fromJSON(inputs.install_sccache)
      id: check-sccache-exists
      run: |
        echo "sccache-exists=$(command -v sccache &> /dev/null && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Install sccache custom prebuilt binary
      if: fromJSON(inputs.install_sccache) && !fromJSON(steps.check-sccache-exists.outputs.sccache-exists)
      run: |
        mkdir /tmp/sscache
        cd /tmp/sscache
        wget -c https://github.com/mozilla/sccache/releases/download/v$SSCACHE_VERSION/sccache-v$SSCACHE_VERSION-x86_64-unknown-linux-musl.tar.gz -O - | tar -xz --strip-components 1
        chmod +x sccache
        sudo mv sccache /usr/local/bin/sccache
        sccache --version
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV
      env:
        SSCACHE_VERSION: 0.3.3
        # That is the default: but we might as well be explicit
        SCCACHE_DIR: $HOME/.cache/sccache
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    # NOTE sccache does not work with CARGO_INCREMENTAL=1; and in CI we SHOULD disable it anyway
    - name: Setup env for sccache for Cargo/Rustc
      if: fromJSON(inputs.install_sccache)
      run: |
        echo "RUSTC_WRAPPER=/usr/local/bin/sccache" >> $GITHUB_ENV
        echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    ############################################################################
    # Sccache restore: dual-provider (GitHub or WarpBuilds).
    # Only one runs based on inputs.cache-provider.
    # The corresponding save is done separately with if: always()
    # so that sccache is saved even on build/test failure.

    - name: Set sccache cache config
      id: sccache-config
      if: fromJSON(inputs.install_sccache)
      run: |
        echo "path=~/.cache/sccache" >> "$GITHUB_OUTPUT"
        echo "key=sccache-${{ runner.os }}-${{ steps.set-rust-compilerid.outputs.rust-compilerid }}-${{ hashFiles('**/Cargo.lock') }}" >> "$GITHUB_OUTPUT"
        echo "restore-keys<<EOF" >> "$GITHUB_OUTPUT"
        echo "sccache-${{ runner.os }}-${{ steps.set-rust-compilerid.outputs.rust-compilerid }}-${{ hashFiles('**/Cargo.lock') }}-" >> "$GITHUB_OUTPUT"
        echo "sccache-${{ runner.os }}-${{ steps.set-rust-compilerid.outputs.rust-compilerid }}-" >> "$GITHUB_OUTPUT"
        echo "sccache-${{ runner.os }}-" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: sccache restore (GitHub)
      id: restore-sccache-github
      if: fromJSON(inputs.install_sccache) && inputs.cache-provider != 'warp'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.sccache-config.outputs.path }}
        key: ${{ steps.sccache-config.outputs.key }}
        restore-keys: ${{ steps.sccache-config.outputs.restore-keys }}

    - name: sccache restore (WarpBuilds)
      id: restore-sccache-warp
      if: fromJSON(inputs.install_sccache) && inputs.cache-provider == 'warp'
      uses: WarpBuilds/cache/restore@v1
      with:
        path: ${{ steps.sccache-config.outputs.path }}
        key: ${{ steps.sccache-config.outputs.key }}
        restore-keys: ${{ steps.sccache-config.outputs.restore-keys }}

    # Export sccache cache info so downstream actions can reference it
    # (e.g. in rust-build-and-test, rust-lint, or save-cache)
    - name: Export sccache cache info
      if: fromJSON(inputs.install_sccache)
      run: |
        echo "SCCACHE_KEY=${{ steps.restore-sccache-github.outputs.cache-primary-key || steps.restore-sccache-warp.outputs.cache-primary-key }}" >> "$GITHUB_ENV"
        echo "SCCACHE_HIT=${{ steps.restore-sccache-github.outputs.cache-hit || steps.restore-sccache-warp.outputs.cache-hit }}" >> "$GITHUB_ENV"
        echo "CACHE_PROVIDER=${{ inputs.cache-provider }}" >> "$GITHUB_ENV"
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    ############################################################################
    # Cargo registry + git db + target directory restore: dual-provider.
    # Same pattern as sccache and ccache: config defined once, both
    # provider steps reference it. The corresponding save is done
    # separately with if: always() so the cache is saved even on failure.

    - name: Set cargo cache config
      id: cargo-config
      run: |
        echo "path<<EOF" >> "$GITHUB_OUTPUT"
        echo "~/.cargo/registry/" >> "$GITHUB_OUTPUT"
        echo "~/.cargo/git/db/" >> "$GITHUB_OUTPUT"
        echo "${{ inputs.working-directory }}/target/" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
        echo "key=cargo-${{ runner.os }}-${{ steps.set-rust-compilerid.outputs.rust-compilerid }}-${{ hashFiles('**/Cargo.lock') }}" >> "$GITHUB_OUTPUT"
        echo "restore-keys<<EOF" >> "$GITHUB_OUTPUT"
        echo "cargo-${{ runner.os }}-${{ steps.set-rust-compilerid.outputs.rust-compilerid }}-${{ hashFiles('**/Cargo.lock') }}-" >> "$GITHUB_OUTPUT"
        echo "cargo-${{ runner.os }}-${{ steps.set-rust-compilerid.outputs.rust-compilerid }}-" >> "$GITHUB_OUTPUT"
        echo "cargo-${{ runner.os }}-" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: cargo + target restore (GitHub)
      id: restore-cargo-github
      if: inputs.cache-provider != 'warp'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.cargo-config.outputs.path }}
        key: ${{ steps.cargo-config.outputs.key }}
        restore-keys: ${{ steps.cargo-config.outputs.restore-keys }}

    - name: cargo + target restore (WarpBuilds)
      if: inputs.cache-provider == 'warp'
      id: restore-cargo-warp
      uses: WarpBuilds/cache/restore@v1
      with:
        path: ${{ steps.cargo-config.outputs.path }}
        key: ${{ steps.cargo-config.outputs.key }}
        restore-keys: ${{ steps.cargo-config.outputs.restore-keys }}

    # Export cargo/target cache info for downstream save steps.
    - name: Export cargo cache info
      run: |
        echo "CARGO_CACHE_KEY=${{ steps.restore-cargo-github.outputs.cache-primary-key || steps.restore-cargo-warp.outputs.cache-primary-key }}" >> "$GITHUB_ENV"
        echo "CARGO_CACHE_HIT=${{ steps.restore-cargo-github.outputs.cache-hit || steps.restore-cargo-warp.outputs.cache-hit }}" >> "$GITHUB_ENV"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    # MUST be after cache restore else the stats are already empty
    - name: Reset sccache stats
      if: fromJSON(inputs.install_sccache)
      run: |
        sccache --zero-stats
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    ############################################################################
    # NOTE: https://github.com/actions-rs/cargo is not maintained anymore
    # https://github.com/actions-rs/cargo/issues/222
    # https://github.com/actions-rs/cargo/issues/216
    # etc
    #
    # But that way just a simple call to "cargo" anyway so we do it directly
    # (with the copy-pasted matcher)

    # https://github.com/actions-rs/cargo/blob/master/.matchers/rust.json
    - name: Setup cargo matcher
      run: echo "::add-matcher::${{ github.action_path }}/rust.json"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
